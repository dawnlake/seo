<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>서 가네 떡볶이 타이쿤</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gamja+Flower&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #333333;
      --panel: #f4f4f1;
      --surface: #ffffff;
      --line: #c9c9c4;
      --accent: #555955;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: '굴림', 'Gulim', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: #e6e6e2 !important;
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      width: 100% !important;
      max-width: 1500px !important;
      height: 100dvh;
      min-height: 100dvh;
      background: #eeeeeb !important;
      background-image: url('game-background.png') !important;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      border: 0 !important;
      border-radius: 0 !important;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      box-shadow: none !important;
      overflow: hidden;
    }

    /* ===== 로비 화면 ===== */
    .lobby-screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #fff !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      transition: opacity 0.3s ease;
      padding: 0 !important;
      text-align: center;
      overflow: hidden;
      border: 0;
    }

    .lobby-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .lobby-screen .lobby-title,
    .lobby-screen .lobby-subtitle,
    .lobby-screen .lobby-credits { 
      display: none !important; 
    }

    .lobby-screen .main-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
    }

    .lobby-screen .tasty-image {
      position: absolute;
      z-index: 1;
      top: 15%;
      left: 35%;
      width: min(32vw, 340px);
      max-width: 45%;
      height: auto;
      object-fit: contain;
      transform: translateX(-50%);
      transform-origin: center;
      animation: tasty-pulse 1.35s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes tasty-pulse {
      0%, 100% { transform: translateX(-50%) scale(0.92); }
      50% { transform: translateX(-50%) scale(1.08); }
    }

    .lobby-screen .start-image-button {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 8%;
      width: min(34vw, 360px);
      max-width: 58%;
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      line-height: 0;
      transform: translateX(-50%) scale(1);
      transform-origin: center;
      transition: transform .18s ease, filter .18s ease;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .lobby-screen .start-image-button img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      pointer-events: none;
    }

    .lobby-screen .start-image-button:hover {
      transform: translateX(-50%) scale(1.09);
      filter: brightness(1.06);
    }

    .lobby-screen .start-image-button:active {
      transform: translateX(-50%) scale(1.15);
    }

    /* ===== 게임 방법 화면 ===== */
    #howto-screen {
      position: absolute;
      inset: 0;
      z-index: 210;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
    }

    #howto-screen.active { display: flex; }

    #howto-screen .howto-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      pointer-events: none;
    }

    #howto-screen .continue-button {
      position: absolute;
      z-index: 1;
      right: 5%;
      bottom: 5%;
      width: min(24vw, 250px);
      min-width: 0;
      height: auto;
      aspect-ratio: 3 / 1;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      transition: transform .18s ease;
      cursor: pointer;
    }

    #howto-screen .continue-button.no-image {
      width: auto;
      min-width: 150px;
      aspect-ratio: auto;
      padding: 14px 28px;
      border: none !important;
      border-radius: 8px;
      background: transparent !important;
      color: #292923;
      box-shadow: none !important;
      font-size: clamp(16px, 2vw, 24px);
      font-weight: 800;
    }

    #howto-screen .continue-button:hover { transform: scale(1.07); }
    #howto-screen .continue-button:active { transform: scale(1.12); }

    /* ===== 상단 헤더 & 상태창 ===== */
    .header {
      width: 100%;
      min-height: 58px;
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      flex: 0 0 auto;
      background: transparent !important;
      background-image: url('images/game-header.png') !important;
      background-position: center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      border: 0 !important;
      color: #fff !important;
    }

    .status-bar {
      display: flex;
      gap: 8px;
    }

    .status-item {
      padding: 5px 10px;
      font-size: 13px;
      background: transparent !important;
      background-image: url('images/status-box.png') !important;
      background-size: 100% 100% !important;
      background-repeat: no-repeat !important;
      border: 0 !important;
      border-radius: 3px !important;
      box-shadow: none !important;
      color: #f7f7f4 !important;
    }

    .status-item span {
      color: #ffe28a;
      font-size: 16px;
    }

    /* ===== 게임 레이아웃 ===== */
    .game-main-layout {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      background: transparent !important;
    }

    /* 손님 영역 */
    .left-customer-panel {
      position: relative;
      flex: 0 0 29% !important;
      min-height: 205px;
      width: 100%;
      padding: 12px 18px 8px;
      padding-right: 0 !important;
      display: grid;
      grid-template-columns: minmax(145px, 20%) minmax(0, 1fr);
      grid-template-rows: 1fr auto;
      align-items: center;
      gap: 8px 16px;
      overflow: hidden;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
    }

    .left-customer-panel::before { display: none !important; }

    .customer-wrapper {
      grid-column: 1;
      grid-row: 1 / span 2;
      width: 100%;
      height: 100%;
      min-height: 0;
      max-width: 210px;
      margin: 0 !important;
      display: flex;
      align-items: center !important;
      justify-content: center !important;
      justify-self: center;
      position: relative;
    }

    .customer-img {
      width: 100%;
      height: 100%;
      max-height: 205px;
      object-fit: contain;
      mix-blend-mode: multiply;
      filter: drop-shadow(0 5px 2px #0002);
    }

    .customer-name {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      background: #373a39 !important;
      color: #fff !important;
      padding: 4px 12px;
      border-radius: 3px !important;
      white-space: nowrap;
      font-size: 12px;
    }

    .speech-bubble {
      grid-column: 2;
      grid-row: 1;
      width: 100%;
      height: auto;
      min-height: 74px;
      margin: 16px 0 0;
      padding: 12px 16px;
      border: 0 !important;
      border-radius: 5px !important;
      background-color: transparent !important;
      background-image: url('speech-bubble.png') !important;
      background-size: 100% 100% !important;
      background-repeat: no-repeat !important;
      box-shadow: none !important;
      color: #303230 !important;
      font-size: clamp(14px, 1.8vw, 19px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.35;
      position: relative;
    }

    .speech-bubble::before, .speech-bubble::after { display: none !important; }

    .dialogue-options {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      gap: 10px;
      justify-content: flex-start;
      height: auto;
      margin: 0 0 6px;
      z-index: 20;
    }

    .dialogue-options.hidden-options {
      visibility: hidden;
      pointer-events: none;
    }

    /* 주방 영역 */
    .right-kitchen-panel {
      flex: 1 1 71%;
      min-height: 0;
      width: 100%;
      display: grid;
      grid-template-columns: minmax(230px, .7fr) minmax(0, 1.65fr) !important;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 14px 22px;
      padding: 26px 26px 18px;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      position: relative;
      overflow: hidden;
    }

    .right-kitchen-panel::before { display: none !important; }

    
.kitchen-top-row {
  position: relative;
  left: -60px;
  top: -20px;
  grid-column: 2;
  grid-row: 1;
  width: 100%;
  min-height: 0;
  height: 100%;
  margin: 0;
  padding: 18px 6px 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}


    
.pot-stage {
  width: min(100%, 900px);
  height: 100%;
  min-height: 300px;
  max-height: 540px;
  flex: 1;
  position: relative;
  left: -40px;
  top: -30px;
  border: 0 !important;
  background: transparent !important;
  overflow: visible;
}



.main-tteokbokki-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
  filter: none !important;
  transform: translate(-170px, -20px);
  transition: opacity .12s ease, transform .16s ease;
  pointer-events: none;
}

.pot-stage.drag-over .main-tteokbokki-img {
  transform: translate(-170px, -20px) scale(1.025);
  filter: drop-shadow(0 0 8px #777) !important;
}

    .food-layer {
      position: absolute;
      left: calc(18% -150px);
  top: calc(17% -20px);
      width: 64%;
      height: 62%;
      pointer-events: none;
    }

    .food-piece {
      position: absolute;
      width: clamp(38px, 5vw, 72px);
      height: clamp(38px, 5vw, 72px);
      object-fit: contain;
      filter: none !important;
      transform: translate(-50%, -50%);
      animation: ingredientPop .18s ease-out;
    }

    @keyframes ingredientPop {
      from { opacity: 0; transform: translate(-50%, -50%) scale(.45) rotate(-15deg); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
    }

    .drop-hint {
      position: absolute;
      left: 50%;
      bottom: 1%;
      transform: translateX(-50%);
      color: #fff !important;
      background: #444745 !important;
      padding: 7px 12px;
      border: 0 !important;
      border-radius: 3px !important;
      font-size: 14px;
      pointer-events: none;
      opacity: .85;
      white-space: nowrap;
      box-shadow: none !important;
    }

    .pot-stage.has-items .drop-hint { display: none; }

    /* 찬장 재료 목록 */
    .kitchen-objects-area {
      grid-column: 1;
      grid-row: 1;
      align-self: stretch;
      align-content: stretch;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 8px;
      padding: 34px 12px 12px;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
    }

    .kitchen-objects-area::before { display: none !important; }

    .kitchen-object {
      min-width: 0;
      min-height: 120px;
      padding: 5px 2px 4px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      gap: 0;
      position: relative;
      overflow: visible;
      background: transparent !important;
      border: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      filter: none !important;
      cursor: grab;
      touch-action: none;
      transition: transform .12s;
    }

    .kitchen-object::before {
      content: '' !important;
      position: absolute;
      z-index: 0;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      width: min(100%, 132px);
      height: 66px;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: contain !important;
      border: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    .kitchen-object[data-ingredient="물"]::before,
    .kitchen-object[data-ingredient="소스"]::before,
    .kitchen-object[data-ingredient="떡"]::before,
    .kitchen-object[data-ingredient="어묵"]::before,
    .kitchen-object[data-ingredient="파"]::before,
    .kitchen-object[data-ingredient="치즈"]::before,
    .kitchen-object[data-ingredient="계란"]::before,
    .kitchen-object[data-ingredient="토마토"]::before {
      background-image: url('bowl.png') !important;
    }

    .kitchen-object img {
      position: relative;
      z-index: 1;
      width: clamp(72px, 8vw, 112px) !important;
      height: clamp(72px, 8vw, 112px) !important;
      object-fit: contain;
      filter: none !important;
      margin: 0 auto -1px;
      pointer-events: none;
    }

    .kitchen-object span {
      position: relative;
      z-index: 2;
      align-self: center;
      margin-top: 0;
      padding: 2px 10px;
      color: #303230 !important;
      font-size: 14px;
      background: #eeeeea !important;
      border: 1px solid #d0d0ca;
      border-radius: 3px !important;
      text-shadow: none !important;
      pointer-events: none;
    }

    .kitchen-object:active { transform: scale(.96); }
    .kitchen-object.drag-source { opacity: .55; }

    .kitchen-object.hidden-item {
      display: none;
    }

    .kitchen-object.hidden-item.show {
      display: flex;
      animation: popIn 0.5s ease-out forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 하단 버튼 영역 */
    .action-row {
      display: flex !important;
      position: relative !important;
      grid-column: 1 / -1 !important;
      grid-row: 2 !important;
      justify-content: center !important;
      align-items: center !important;
      gap: 5px !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 5px 0 0 !important;
      left: 30px !important;
      top: -20px !important;
      transform: none !important;
    }

    /* 커스텀 이미지 버튼 공통 */
    .image-button {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 4px !important;
      background: #555955 !important;
      color: #fff !important;
      box-shadow: none !important;
      line-height: 0;
      overflow: visible;
      transition: transform .16s ease, filter .16s ease;
      cursor: pointer;
    }

    .image-button > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .image-button > span { display: none; }

    .image-button.no-image > span {
      display: block;
      font: inherit;
      font-size: 16px;
      line-height: 1.2;
      padding: 12px 18px;
      white-space: nowrap;
    }

    .image-button:hover { transform: scale(1.07); filter: brightness(1.06); }
    .image-button:active { transform: scale(1.12); }
    .image-button:focus-visible { outline: 3px solid #ffe28a; outline-offset: 4px; }

    .dialogue-options .image-button { width: clamp(70px, 9vw, 120px); height: clamp(38px, 5vw, 62px); }
    .action-row .image-button { min-width: 0; height: clamp(42px, 6vw, 72px); }
    .modal-btn-group .image-button { min-width: 0; min-height: 50px; width: 100%; }
    .modal-btn-group .image-button.no-image { min-height: 0; }

    /* 드래그 이펙트 */
    .drag-ghost {
      position: fixed;
      z-index: 9999;
      width: 110px;
      height: 110px;
      object-fit: contain;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(1.12);
      filter: drop-shadow(0 3px 2px #0003) !important;
    }

    .drag-halo {
      position: fixed;
      z-index: 9998;
      width: 128px;
      height: 128px;
      border: 2px solid #fff !important;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 5px #3332 !important;
    }

    .pop-effect {
      position: absolute;
      font-size: 20px;
      font-weight: bold;
      pointer-events: none;
      animation: popUp 0.8s ease-out forwards;
      z-index: 30;
    }

    @keyframes popUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
    }

    /* ===== 결과 모달 ===== */
    .modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex; justify-content: center; align-items: center;
      z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: #f7f7f4 !important;
      background-image: url('result-panel.png') !important;
      background-size: 100% 100% !important;
      background-repeat: no-repeat !important;
      border: 1px solid #c9c9c4 !important;
      border-radius: 5px !important;
      padding: 22px;
      width: 75%;
      max-width: 460px;
      text-align: center;
      box-shadow: none !important;
    }

    .modal-card h2 {
      margin-top: 0;
      font-size: 24px;
      color: #333;
    }

    .coupon-box {
      border: 2px dashed #e76f51;
      background-color: transparent !important;
      background-image: url('coupon-box.png') !important;
      background-size: 100% 100% !important;
      background-repeat: no-repeat !important;
      border-color: transparent !important;
      border-radius: 14px;
      padding: 10px;
      margin: 12px 0;
    }

    .modal-btn-group {
      display: flex;
      gap: 10px;
    }

    .modal-btn-group button { flex: 1; }

    /* ===== 반응형 미디어 쿼리 ===== */
    @media(max-width: 760px) {
      #game-container { height: 100dvh; min-height: 700px; }
      .left-customer-panel {
        padding-right: 0 !important;
        flex-basis: 39% !important;
        min-height: 310px !important;
        grid-template-columns: 92px minmax(0, 1fr) !important;
      }
      .customer-img { max-height: 155px; }
      .speech-bubble { margin-top: 15px; font-size: 13px; padding: 8px; min-height: 55px; }
      .right-kitchen-panel {
        grid-template-columns: minmax(108px, .72fr) minmax(0, 1.4fr) !important;
        padding: 18px 7px 8px !important;
        gap: 6px;
      }
      .kitchen-objects-area { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 2px; padding: 27px 3px 5px; }
      .kitchen-object { min-height: 92px; padding: 2px 0; }
      .kitchen-object::before { bottom: 20px; width: 96%; height: 42px; }
      .kitchen-object img { width: clamp(48px, 12vw, 76px) !important; height: clamp(48px, 12vw, 76px) !important; }
      .kitchen-object span { font-size: 10px; padding: 1px 6px; }
      .kitchen-top-row { padding: 20px 0 4px; }
      .pot-stage { min-height: 210px; }
      .food-layer { left: 15%; top: 20%; width: 70%; height: 58%; }
      .food-piece { width: clamp(25px, 7vw, 44px); height: clamp(25px, 7vw, 44px); }
      .drop-hint { white-space: normal; width: 84%; text-align: center; font-size: 10px; }
      .action-row { left: 44% !important; right: 25% !important; bottom: 2% !important; width: 30% !important; gap: 4px !important; }
      .action-row .image-button { height: 34px !important; }
      .drag-ghost { width: 82px; height: 82px; }
      .drag-halo { width: 98px; height: 98px; }
      #howto-screen .continue-button { width: 35vw; max-width: 180px; }
      .dialogue-options .image-button { width: 76px; height: 42px; }
      .action-row .image-button { height: 42px; }
    }
  

    /* ===== 화면 비율 고정 + 손님 원본 이미지 유지 ===== */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0 !important;
      overflow: hidden !important;
    }

    body {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    #game-container {
      position: fixed !important;
      left: 50% !important;
      top: 50% !important;
      width: min(100vw, 177.7778dvh) !important;
      height: min(56.25vw, 100dvh) !important;
      min-width: 0 !important;
      min-height: 0 !important;
      max-width: none !important;
      aspect-ratio: 16 / 9 !important;
      flex: none !important;
      overflow: hidden !important;
      transform: translate(-50%, -50%) !important;
      transform-origin: center center !important;
    }

    /* 세로 기기에서는 게임 전체를 90도 회전해 가로 플레이 화면으로 표시 */
    @media (orientation: portrait) {
      #game-container {
        width: min(100dvh, 177.7778dvw) !important;
        height: min(56.25dvh, 100dvw) !important;

    function playNote(freq, duration = 0.4, delay = 0) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        }, delay * 1000);
      } catch (e) {
        console.log(e);
      }

      },

      },

      },
      25: {
        A: { target: { '물': 1 }, dialogues: ["물 내놔.","…고양이 먹일 물.", "그냥 물이면 돼."], successDialogue: "흠. 나쁘지 않네.", failDialogue: "가라 그냥." },

    };

    // 배경음악: HTML 파일과 같은 위치의 sounds/background.mp3 파일을 반복 재생합니다.
    const backgroundMusic = new Audio('sounds/background.mp3');
    backgroundMusic.loop = true;
    backgroundMusic.volume = 0.25;

    function startBackgroundMusic() {
      if (!backgroundMusic.paused) return;
      const playback = backgroundMusic.play();
      if (playback && typeof playback.catch === 'function') {
        playback.catch(error => console.warn('배경음악을 재생하지 못했습니다. sounds/background.mp3 경로와 브라우저 소리 설정을 확인해 주세요.', error));
      }
    }

    function stopBackgroundMusic() {
      backgroundMusic.pause();
      backgroundMusic.currentTime = 0;
    }

    // 손님 3, 5, 14의 주문 성공 효과음. 손님 14는 우선 손님 3과 같은 효과음을 사용합니다.
    const guestSuccessSounds = {
      3: new Audio('sounds/guest3-success.mp3'),
      5: new Audio('sounds/guest5-success.mp3'),
      14: new Audio('sounds/guest14-success.mp3'),
      19: new Audio('sounds/guest19-appear.mp3')
    };

    function playGuestSuccessSound(guestNumber) {
      const audio = guestSuccessSounds[guestNumber];
      if (!audio) return;
      try {
        audio.pause();
        audio.currentTime = 0;
        const playback = audio.play();
        if (playback && typeof playback.catch === 'function') {
          playback.catch(error => console.warn('효과음을 재생하지 못했습니다. 파일 경로와 브라우저 소리 설정을 확인해 주세요.', error));
        }
      } catch (error) {
        console.warn('효과음 재생 오류:', error);
      }
    }

    function startGame() {
      document.getElementById('howto-screen').classList.add('active');
    }

    function continueToGame() {
      startBackgroundMusic();
      document.getElementById('howto-screen').classList.remove('active');
      lobbyScreen.classList.add('hidden');
      resetHiddenItems();
      restartGame();
    }

    function startGameFromModal() {
      startBackgroundMusic();
      resultModal.classList.remove('active');
      resetHiddenItems();
      restartGame();
    }

    function goToLobby() {
      stopBackgroundMusic();
      if (timer) clearInterval(timer);
      isPlaying = false;
      resultModal.classList.remove('active');
      document.getElementById('howto-screen').classList.remove('active');
      lobbyScreen.classList.remove('hidden');
    }

    function resetHiddenItems() {
      eggUnlocked = false;
      tomatoUnlocked = false;
      hiddenEggBtn.classList.remove('show');
      hiddenTomatoBtn.classList.remove('show');
    }

    function startTimer() {
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        timeLeft--;
        timeLeftEl.innerText = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function checkAndPlayNoteEffects() {
      if (currentCustomerIndex === 3 && currentSelectedKey === 'A') {
        if (dialogueStep === 1) {
          playNote(NOTE_FA, 0.5, 0);
        } else if (dialogueStep === 2) {
          playNote(NOTE_FA, 0.4, 0);
          playNote(NOTE_DO, 0.5, 0.35);
        }
      }
    }

    function nextCustomer() {
      if (!isPlaying) return;

      resetHiddenItems();

      currentCustomerIndex = Math.floor(Math.random() * 25) + 1;
      if (currentCustomerIndex === 19) {
    playGuestSuccessSound(19);
}
      customerImg.src = GUEST_IMAGES[currentCustomerIndex];

      const guestObj = GUEST_DATA[currentCustomerIndex];
      currentSelectedKey = Math.random() < 0.5 ? 'A' : 'B';
      currentCustomerPattern = JSON.parse(JSON.stringify(guestObj[currentSelectedKey]));

      dialogueStep = 0;
      isCookingMode = false;

      dialogueOptions.classList.remove('hidden-options');
      speechBubble.innerText = currentCustomerPattern.dialogues[dialogueStep];

      resetPot();
    }

    function askPardon() {
      if (!isPlaying || isCookingMode) return;

      dialogueStep++;
      if (dialogueStep >= currentCustomerPattern.dialogues.length) {
        dialogueStep = currentCustomerPattern.dialogues.length - 1;
      }
      speechBubble.innerText = currentCustomerPattern.dialogues[dialogueStep];

      checkAndPlayNoteEffects();

      if (currentCustomerIndex === 7 && currentSelectedKey === 'A' &&
          dialogueStep === currentCustomerPattern.dialogues.length - 1 && 
          !eggUnlocked) {
        eggUnlocked = true;
        hiddenEggBtn.classList.add('show');
        showPopEffect("신선한 '계란' 발견!", "#e76f51");
      }

      if (currentCustomerIndex === 8 && currentSelectedKey === 'A' &&
          dialogueStep === currentCustomerPattern.dialogues.length - 1 && 
          !tomatoUnlocked) {
        tomatoUnlocked = true;
        hiddenTomatoBtn.classList.add('show');
        showPopEffect("상큼한 '토마토' 발견!", "#e76f51");
      }
    }

    function confirmOrder() {
      if (!isPlaying) return;
      isCookingMode = true;

      dialogueOptions.classList.add('hidden-options');
      speechBubble.innerText = "기다리는 중!";
    }

    function addIngredient(ing) {
      if (!isPlaying || !isCookingMode) return;
      if (currentPot.length >= 8) return;

      currentPot.push(ing);
      renderPot();

      potArea.classList.add('bounce');
      setTimeout(() => potArea.classList.remove('bounce'), 100);
    }

    function updateTteokbokkiImage() {
      const count = {};
      currentPot.forEach(item => count[item] = (count[item] || 0) + 1);
      const hasTteok = (count['떡'] || 0) > 0;
      const hasEomuk = (count['어묵'] || 0) > 0;
      const hasSauce = (count['소스'] || 0) > 0;
      const hasCheese = (count['치즈'] || 0) > 0;
      const hasWater = (count['물'] || 0) > 0;

      let nextImage = 'bim.png';
      let nextAlt = '빈 철판';

      if (currentPot.length > 0) {
        if (!hasTteok && hasEomuk && !hasSauce) {
          nextImage = 'onlyeomuk.png';
          nextAlt = '어묵만 올린 철판';
        } else if (hasTteok && hasEomuk && hasSauce && hasCheese) {
          nextImage = 'chetteokb.png';
          nextAlt = '치즈 떡볶이';
        } else if (hasTteok && hasEomuk && hasSauce) {
          nextImage = 'tteokbok.png';
          nextAlt = '기본 떡볶이';
        } else if (hasTteok && hasEomuk) {
          nextImage = 'tteokmuk.png';
          nextAlt = '떡어묵';
        } else if (hasSauce) {
          nextImage = 'onlyss.png';
          nextAlt = '소스';
        } else if (hasWater) {
          nextImage = 'onlywat.png';
          nextAlt = '물';
        } else {
          nextImage = 'bim.png';
          nextAlt = '재료를 올리는 중인 철판';
        }
      }

      mainImg.onerror = () => {
        mainImg.onerror = null;
        mainImg.src = 'bim.png';
      };
      mainImg.src = nextImage;
      mainImg.alt = nextAlt;

      const foodLayer = document.getElementById('food-layer');
      if (foodLayer) {
        foodLayer.innerHTML = '';
        const isIllustratedState = ['chetteokb.png','tteokbok.png','tteokmuk.png','onlyeomuk.png'].includes(nextImage);
        if (!isIllustratedState) {
          const positions = [[30,35],[48,27],[66,35],[40,49],[59,49],[28,62],[72,57],[50,68],[38,30],[63,67],[52,43],[74,42]];
          currentPot.forEach((ing, index) => {
            const piece = document.createElement('img');
            piece.src = INGREDIENT_IMAGES[ing];
            piece.className = 'food-piece';
            piece.alt = ing;
            const pos = positions[index % positions.length];
            piece.style.left = (50 + (pos[0] - 50) * 2) + '%';
            piece.style.top = pos[1] + '%';
            piece.style.zIndex = String(index + 1);
            foodLayer.appendChild(piece);
          });
        }
      }
    }

    function renderPot() {
      updateTteokbokkiImage();
      potArea.classList.toggle('has-items', currentPot.length > 0);
    }

    function resetPot() {
      currentPot = [];
      renderPot();
    }

    function serveOrder() {
      if (!isPlaying) return;

      if (!isCookingMode) {
        showPopEffect("오케이를 먼저 눌러주세요!", "#e76f51");
        return;
      }

      const potCount = {};
      currentPot.forEach(ing => {
        potCount[ing] = (potCount[ing] || 0) + 1;
      });

      const targetOrder = currentCustomerPattern.target;
      let isCorrect = true;

      for (const [ing, count] of Object.entries(targetOrder)) {
        if (potCount[ing] !== count) {
          isCorrect = false;
          break;
        }
      }

      for (const [ing, count] of Object.entries(potCount)) {
        if (!targetOrder[ing] || targetOrder[ing] !== count) {
          isCorrect = false;
          break;
        }
      }

      isCookingMode = false;

      if (isCorrect) {
        if (currentCustomerIndex === 3 || currentCustomerIndex === 5 || currentCustomerIndex === 14) {
          playGuestSuccessSound(currentCustomerIndex);
        }
        const points = Object.values(targetOrder).reduce((a, b) => a + b, 0) * 100;
        score += points;
        servedCount++;
        scoreEl.innerText = score;

        speechBubble.innerText = currentCustomerPattern.successDialogue;
        showPopEffect(`성공! +${points}`, '#2a9d8f');
        resetPot();

        setTimeout(() => {
          if (isPlaying) {
            nextCustomer();
          }
        }, 1200);
      } else {
        speechBubble.innerText = currentCustomerPattern.failDialogue;
        showPopEffect(`실패!`, '#e76f51');
        resetPot();

        setTimeout(() => {
          if (isPlaying) {
            nextCustomer();
          }
        }, 1200);
      }
    }

    function showPopEffect(text, color) {
      const pop = document.createElement('div');
      pop.className = 'pop-effect';
      pop.innerText = text;
      pop.style.color = color;
      pop.style.left = '60%';
      pop.style.top = '20%';
      document.getElementById('game-container').appendChild(pop);

      setTimeout(() => pop.remove(), 800);
    }

    function endGame() {
      clearInterval(timer);
      isPlaying = false;
      finalScoreEl.innerText = score;
      servedCountEl.innerText = servedCount;
      resultModal.classList.add('active');
    }

    function restartGame() {
      score = 0;
      servedCount = 0;
      timeLeft = 100;
      isPlaying = true;

      scoreEl.innerText = '0';
      timeLeftEl.innerText = '100';
      resultModal.classList.remove('active');

      nextCustomer();
      startTimer();
    }

    /* 드래그 앤 드롭 조작 이벤트 초기화 */
    (() => {
      const stage = document.getElementById('pot-area');
      const stations = [...document.querySelectorAll('.kitchen-object[data-ingredient]')];
      if (!stage || !stations.length) return;

      let drag = null;
      let ghost = null;
      let halo = null;
      let startX = 0, startY = 0;

      const move = (e) => {
        if (!drag || !ghost) return;
        ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
        halo.style.left = e.clientX + 'px'; halo.style.top = e.clientY + 'px';
        const r = stage.getBoundingClientRect();
        const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        stage.classList.toggle('drag-over', inside);
      };

      const finish = (e) => {
        if (!drag) return;
        const x = Number.isFinite(e?.clientX) ? e.clientX : -9999;
        const y = Number.isFinite(e?.clientY) ? e.clientY : -9999;
        const r = stage.getBoundingClientRect();
        const inside = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
        if (inside && Math.hypot(x - startX, y - startY) > 8) {
          addIngredient(drag.dataset.ingredient);
          stage.classList.add('has-items');
        }
        drag.classList.remove('drag-source');
        stage.classList.remove('drag-over');
        ghost?.remove(); halo?.remove();
        ghost = halo = null; drag = null;
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', finish);
      };

      stations.forEach((station) => {
        const img = station.querySelector('img');
        if (img) img.draggable = false;
        station.addEventListener('pointerdown', (e) => {
          if (e.button !== 0 && e.pointerType === 'mouse') return;
          if (typeof isPlaying !== 'undefined' && !isPlaying) return;
          if (typeof isCookingMode !== 'undefined' && !isCookingMode) return;
          e.preventDefault();
          drag = station; startX = e.clientX; startY = e.clientY;
          station.classList.add('drag-source');
          ghost = document.createElement('img'); ghost.className = 'drag-ghost'; ghost.src = img?.src || '';
          halo = document.createElement('div'); halo.className = 'drag-halo';
          document.body.append(halo, ghost);
          move(e);
          window.addEventListener('pointermove', move);
          window.addEventListener('pointerup', finish, { once: true });
        });
      });

      window.addEventListener('pointercancel', (e) => finish(e));
      window.addEventListener('blur', () => {
        if (drag) finish({ clientX: -9999, clientY: -9999 });
      });
      document.addEventListener('dragstart', (e) => e.preventDefault());

      const originalReset = window.resetPot;
      window.resetPot = function() {
        if (originalReset) originalReset();
        stage.classList.remove('has-items');
      };
    })();
  </script>
